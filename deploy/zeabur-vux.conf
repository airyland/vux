server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-4251327906175578, DIRECT, f08c47fec0942fa0\n";
    }

    location = /vux-loader-anonymous-tracking.html {
        default_type text/plain;
        return 200 "thanks\n";
    }

    location = /MP_verify_zCFF7vsWSSxFJYpa.txt {
        default_type text/plain;
        return 200 "zCFF7vsWSSxFJYpa\n";
    }

    location /analytics/ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.okdid.com;
        proxy_pass https://api.okdid.com/;
    }

    location ^~ /wemp/ {
        proxy_pass http://172.16.13.81:8001/api/;
    }

    location ^~ /werss-api/ {
        proxy_pass http://172.16.13.81:8001/api/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
